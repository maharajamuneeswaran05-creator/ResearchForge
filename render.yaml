services:
  # ─────────────────────────────────────────────────────────
  # ResearchForge Unified (FastAPI + Next.js in 1 Container)
  # ─────────────────────────────────────────────────────────
  - type: web
    name: researchforge
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      # Inference API key (NVIDIA or Nebius)
      - key: NVIDIA_API_KEY
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_MODEL
        value: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      - key: NEBIUS_BASE_URL
        value: https://integrate.api.nvidia.com/v1/

      # Tavily search
      - key: TAVILY_API_KEY
        sync: false
      - key: TAVILY_MAX_RESULTS
        value: "5"

      # Sandboxed demo execution
      - key: EXPERIMENT_DEMO_MODE
        value: "true"
      - key: REQUEST_TIMEOUT_SECONDS
        value: "60"
      - key: EXPERIMENT_TIMEOUT_SECONDS
        value: "900"
